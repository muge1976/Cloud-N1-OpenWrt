name: Cloud N1 OpenWrt

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-n1-openwrt.yaml'
      - 'files/**'
      - 'script.sh'
      - 'config.sh'
  workflow_dispatch:
  schedule:
    # 每 3 天检测一次上游更新（UTC 20:00 = 北京时间次日 04:00）
    - cron: 0 20 */3 * *

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  SCRIPT_SH: script.sh
  CONFIG_SH: config.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  # 固定 6.18.64：与 LEDE 侧锁定的内核一致，且 ophub/kernel 目前没有 6.18.65 内核包（会 404）
  KERNEL_VERSION: 6.18.64
  KERNEL_REPO_URL: ophub/kernel
  KERNEL_TAG: stable

jobs:
  check_updates:
    name: Check upstream updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Compare upstream commit
      id: gate
      run: |
        set -euo pipefail
        upstream="$(git ls-remote https://github.com/coolsnowwolf/lede master | cut -c1-40)"
        last="$(cat .upstream-sha 2>/dev/null || echo none)"
        echo "upstream=$upstream"
        echo "last_built=$last"
        if [[ "$upstream" == "$last" && "$GITHUB_EVENT_NAME" == "schedule" ]]; then
          echo "上游无更新，跳过本次编译"
          echo "build=false" >> "$GITHUB_OUTPUT"
        else
          echo "需要编译"
          echo "build=true" >> "$GITHUB_OUTPUT"
        fi

  build_openwrt:
    name: Build OpenWrt and release
    needs: check_updates
    if: needs.check_updates.outputs.build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:

    - name: Resolve latest kernel version
      id: resolve_kernel
      run: |
        kernel_api="https://github.com/${KERNEL_REPO_URL}/releases/expanded_assets/kernel_${KERNEL_TAG}"

        if [[ "$KERNEL_VERSION" == "latest" ]]; then
          latest_version="$(curl -fsSL "$kernel_api" | grep -oP "(?<=[/>])[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)" | sort -urV | head -n 1)"
        elif [[ "$KERNEL_VERSION" =~ \.y$ ]]; then
          kernel_series="$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1"."$2}')"
          kernel_regex="${kernel_series//./\\.}"
          latest_version="$(curl -fsSL "$kernel_api" | grep -oP "(?<=[/>])${kernel_regex}\.[0-9]+(?=\.tar\.gz)" | sort -urV | head -n 1)"
        else
          echo "Using fixed kernel version: $KERNEL_VERSION"
          echo "RESOLVED_KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -z "$latest_version" ]]; then
          echo "Unable to resolve latest kernel version from $kernel_api"
          exit 1
        fi

        echo "Resolved latest kernel version: $latest_version"
        echo "KERNEL_VERSION=$latest_version" >> $GITHUB_ENV
        echo "RESOLVED_KERNEL_VERSION=$latest_version" >> $GITHUB_ENV
        echo "kernel_version=$latest_version" >> "$GITHUB_OUTPUT"

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      continue-on-error: true
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Disk space
      run: |
           echo "Free space:"
           df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        . /etc/os-release
        sources="$RUNNER_TEMP/ubuntu.list"
        cat > "$sources" <<EOF
        deb https://archive.ubuntu.com/ubuntu $VERSION_CODENAME main restricted universe multiverse
        deb https://archive.ubuntu.com/ubuntu $VERSION_CODENAME-updates main restricted universe multiverse
        deb https://security.ubuntu.com/ubuntu $VERSION_CODENAME-security main restricted universe multiverse
        EOF
        apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
                     -o Acquire::Retries=3 -o Acquire::https::Timeout=20)
        sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any -qq update
        sudo -E apt-get "${apt_options[@]}" -qy install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"

    - name: Install clang for host gn
      run: |
        . /etc/os-release
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list > /dev/null
        sudo apt-get -qq update
        sudo apt-get -qy install clang-18
        sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
        sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
        clang++ --version

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        useVersionInfo=$(git show -s --date=short --format="date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
        echo "DATE=$(date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "tag_name=$(date +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> $GITHUB_ENV

    - name: Restore ccache and downloads
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          .ccache
        key: ${{ runner.os }}-owrt-${{ hashFiles('config*.sh','script.sh') }}
        restore-keys: |
          ${{ runner.os }}-owrt-

    - name: Update feeds
      run: |
        if [[ -e files ]]; then
          mv files openwrt/files
        fi
        chmod +x $SCRIPT_SH
        ./$SCRIPT_SH
        cd openwrt
        # 追加第三方源：helloworld（ssr-plus 等）、kenzok8/small（lucky/openlist/clouddrive2 等）、
        # kenzok8/openwrt-packages（passwall 依赖、主题、部分 luci 应用）
        for feed in "helloworld https://github.com/fw876/helloworld.git" \
                    "small https://github.com/kenzok8/small-package.git" \
                    "kz https://github.com/kenzok8/openwrt-packages.git"; do
          name="${feed%% *}"
          url="${feed#* }"
          grep -qE "^src-git[[:space:]]+$name([[:space:]]|$)" feeds.conf.default || echo "src-git $name $url" >> "feeds.conf.default"
        done
        for attempt in 1 2 3; do
          ./scripts/feeds update -a && break
          [[ "$attempt" -eq 3 ]] && exit 1
          sleep 10
        done
        luci_config="feeds/luci/modules/luci-base/root/etc/config/luci"
        if [[ -f "$luci_config" ]]; then
          sed -i "s/bootstrap/argon/g" "$luci_config"
        else
          echo "LuCI config is unavailable; skipping default theme adjustment"
        fi
        xfsprogs_makefile="feeds/packages/utils/xfsprogs/Makefile"
        if [[ -f "$xfsprogs_makefile" ]]; then
          sed -i 's/TARGET_CFLAGS += -DHAVE_MAP_SYNC/TARGET_CFLAGS += -DHAVE_MAP_SYNC -D_LARGEFILE64_SOURCE/' "$xfsprogs_makefile"
        else
          echo "xfsprogs feed is unavailable; skipping legacy compiler flag adjustment"
        fi

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        chmod +x $CONFIG_SH
        ./$CONFIG_SH

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        if ! grep -Fxq 'CONFIG_TARGET_armsr_armv8_DEVICE_generic=y' .config; then
          echo "::error::Expected armsr/armv8 generic target after defconfig"
          exit 1
        fi
        for package in luci-app-amlogic luci-app-openclash luci-app-adblock luci-app-lucky; do
          if ! grep -Fxq "CONFIG_PACKAGE_${package}=y" .config; then
            echo "::error::Required package missing after defconfig: $package"
            exit 1
          fi
        done
        # GitHub serves the same release snapshot as git.kernel.org for 1.8.10.
        erofs_recipe=tools/erofs-utils/Makefile
        if grep -Fxq 'PKG_VERSION:=1.8.10' "$erofs_recipe"; then
          archive=erofs-utils-1.8.10.tar.gz
          expected=$(sed -n 's/^PKG_HASH:=//p' "$erofs_recipe")
          mkdir -p dl
          if curl -fsSL --retry 3 --retry-all-errors --max-time 60 \
              https://codeload.github.com/erofs/erofs-utils/tar.gz/refs/tags/v1.8.10 \
              -o "dl/$archive.tmp" && \
              echo "$expected  dl/$archive.tmp" | sha256sum --check --status; then
            mv "dl/$archive.tmp" "dl/$archive"
          else
            rm -f "dl/$archive.tmp"
            echo "::warning::GitHub snapshot unavailable or hash mismatch; using LEDE mirrors"
          fi
        fi
        make tools/erofs-utils/download V=s
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
        export CCACHE_MAXSIZE=2G
        ccache --show-stats || true
        if ! make -j$(nproc); then
          echo "::error::编译失败，下面打印各包错误摘要"
          grep -h -B2 -A6 "Error 1\|failed to build" logs/*.txt 2>/dev/null | tail -200 || true
          exit 1
        fi
        ccache --show-stats || true
        df -h
        du -h --max-depth=1 ./bin
        rm -rf ./build_dir

    - name: Package Armvirt as OpenWrt
      uses: ophub/flippy-openwrt-actions@main
      env:
        OPENWRT_ARMVIRT: openwrt/bin/targets/armsr/armv8/*-generic-rootfs.tar.gz
        PACKAGE_SOC: s905d
        KERNEL_REPO_URL: ${{ env.KERNEL_REPO_URL }}
        KERNEL_VERSION_NAME: ${{ steps.resolve_kernel.outputs.kernel_version }}
        KERNEL_AUTO_LATEST: false
        WHOAMI: huangqian8

    - name: Organize files
      id: organize
      if: success() && env.UPLOAD_FIRMWARE == 'true'
      run: |
        : "${PACKAGED_OUTPUTPATH:?Missing packaged firmware directory}"
        shopt -s nullglob
        images=("$PACKAGED_OUTPUTPATH"/*s905d*.img "$PACKAGED_OUTPUTPATH"/*s905d*.img.gz)
        found=false
        for image in "${images[@]}"; do
          if [[ -f "$image" && -s "$image" ]]; then
            found=true
            break
          fi
        done
        if [[ "$found" != true ]]; then
          echo "::error::No non-empty s905d firmware image in $PACKAGED_OUTPUTPATH"
          exit 1
        fi
        shopt -u nullglob
        cd openwrt/bin/targets/armsr/armv8
        rm -rf packages openwrt-armvirt-64-default.manifest openwrt-armvirt-64-Image sha256sums version.buildinfo feeds.buildinfo openwrt-armvirt-64-generic-kernel.bin openwrt-armvirt-64-generic.manifest
        release_dir="$RUNNER_TEMP/release-assets"
        mkdir -p "$release_dir"
        build_date="$(date +%Y%m%d)"
        # 发布只保留刷机包（s905d 的 img.gz），文件名前加编译日期，其余中间产物不进 Release
        for image in "${images[@]}"; do
          if [[ -f "$image" && -s "$image" ]]; then
            cp -- "$image" "$release_dir/${build_date}_$(basename "$image")"
          fi
        done
        echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: success() && steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware
        path: |
            ${{ env.FIRMWARE }}
            ${{ env.PACKAGED_OUTPUTPATH }}

    - name: Create release
      id: release
      if: success() && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.DATE }} ❤️ | N1-OpenWrt 自动编译打包
        artifactErrorsFailBuild: true
        tag: ${{ env.tag_name }}
        commit: ${{ github.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          编译使用版本:
          ${{ env.useVersionInfo }}

          刷机固件简介：
            打包日期：${{ env.PACKAGED_OUTPUTDATE }}
            内核版本：${{ env.KERNEL_VERSION }}
            默认IP：192.168.2.3 默认用户名密码： root/password
        artifacts: "${{ env.RELEASE_DIR }}/*"

    - name: Record upstream commit
      if: success() && steps.release.outcome == 'success'
      run: |
        set -euo pipefail
        upstream="$(git ls-remote https://github.com/coolsnowwolf/lede master | cut -c1-40)"
        echo "$upstream" > .upstream-sha
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .upstream-sha
        git commit -m "chore: record upstream ${upstream}" || echo "无变化"
        git push origin HEAD:main || echo "推送失败，忽略"

    - name: Remove old Releases
      if: success() && steps.release.outcome == 'success'
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prune_runs:
    name: Clean up previous build runs
    needs: build_openwrt
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep three successful builds and remove older unsuccessful runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          snapshot="$RUNNER_TEMP/build-runs.json"
          gh api --paginate --slurp "$api/workflows/cloud-n1-openwrt.yaml/runs?per_page=100" > "$snapshot"

          # The current successful build occupies one of the three slots.
          # Leave newer runs and unfinished builds alone.
          jq -r --argjson current "$GITHUB_RUN_NUMBER" '
            [.[].workflow_runs[] | select(.run_number < $current and .status == "completed")]
            | sort_by(.run_number) | reverse
            | (map(select(.conclusion == "success"))[2:] +
               map(select(.conclusion != "success")))[] | .id
          ' "$snapshot" > "$RUNNER_TEMP/obsolete-runs"
          while read -r id; do
            gh api --method DELETE "$api/runs/$id"
          done < "$RUNNER_TEMP/obsolete-runs"
